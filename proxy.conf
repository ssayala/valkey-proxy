# ── cluster entry node ──────────────────────────────────────────────────
# proxy connects to this node on startup, sends CLUSTER NODES to discover
# the full cluster topology. An IPv4/IPv6 address or a hostname (e.g. a
# Kubernetes Service name); cluster nodes may announce hostnames too.
server-ip    192.168.1.100
server-port  6379

# ── cluster topology refresh ────────────────────────────────────────────
# how often (ms) the proxy re-runs CLUSTER NODES in the background to pick
# up node additions, promoted replicas, and failed-but-unpromoted masters
# without a restart. 0 disables periodic refresh (a MOVED reply still
# triggers an immediate one). In Kubernetes, where restarted Valkey pods
# come back on new IPs, keep this on.
# default: 0
cluster_refresh_interval_ms  500

# once a master is missing from discovery (or shows fail) with nobody
# having taken over its slots, how long (ms) to keep its idle connections
# around before releasing them. Only relevant when the refresh above is on.
# default: 10000
cluster_node_fail_grace_ms  10000

# connect timeout (ms) used for backend connections made *after* startup:
# worker-thread pool (re)connects (e.g. reconnecting to a promoted replica)
# and the periodic refresh's own probes. Kept short on purpose -- unlike the
# one-shot startup discovery's fixed 5s timeout, these run on a worker
# thread or block a refresh cycle, so a momentarily-unreachable node
# shouldn't be allowed to stall either for seconds.
# default: 1000
backend_connect_timeout_ms  1000

# ── client listener ─────────────────────────────────────────────────────
# IPv4/IPv6 address or hostname; omit "bind" to listen on all interfaces
# (dual-stack). Sidecar deployments: bind 127.0.0.1 and/or use unix-socket.
bind  192.168.1.200
port  7777

# ── timeouts ────────────────────────────────────────────────────────────
# close clients idle for more than N seconds (0 = never; blocked and
# subscribed clients are exempt, as in Valkey)
# timeout  0
# seconds a TLS client gets to finish its handshake (default: 10)
# tls-handshake-timeout  10
# on SIGTERM/SIGINT: stop accepting, let clients finish what's in flight,
# and exit when none are left or after this many seconds (default: 10)
# shutdown-timeout  10

# ── max connections ─────────────────────────────────────────────────────
# process-wide fd budget shared by client connections and backend pool
# connections (client sockets + backend pool connections + listener(s)
# must all fit under this number). Raising it also requires the OS-level
# 'ulimit -n' for this process to be at least this high; the proxy tries
# to raise its own soft limit at startup and prints a warning if it can't.
# default: 4000
max_connection  4000

# ── worker threads ──────────────────────────────────────────────────────
# each worker thread maintains its own independent set of connection pools
# default: 1
worker-thread-no  1

# ── default database ────────────────────────────────────────────────────
# proxy sends SELECT <db> on every new connection (skipped when db=0)
# when a client issues SELECT to switch databases, proxy creates a new
# full set of connection pools for that db on demand
# default: 0
db  0

# ── normal connection pool ──────────────────────────────────────────────
# used for the vast majority of read/write commands (GET, SET, HGET, etc.)
# default: min=2, max=20
min_normal_connection  2
max_normal_connection  20

# ── blocking connection pool ────────────────────────────────────────────
# used for blocking commands (BLPOP, BRPOP, BZPOPMIN, etc.)
# connections are kept in blocking mode
# default: min=2, max=10
min_blocking_connection  2
max_blocking_connection  10

# ── subscription connection pool ────────────────────────────────────────
# used for pub/sub commands (SUBSCRIBE, PSUBSCRIBE, etc.)
# connection is pinned to the client until all subscriptions are cancelled
# default: min=0 (on-demand), max=10
min_subscription_connection  0
max_subscription_connection  10

# ── transaction connection pool ─────────────────────────────────────────
# unused: MULTI/EXEC/WATCH run on a private connection pinned to the client
# for the transaction (see docs/FEATURES.md); these settings are ignored
# default: min=0 (on-demand), max=10
min_transaction_connection  0
max_transaction_connection  10

# ── ACL connection pool ─────────────────────────────────────────────────
# used for access control commands (ACL, AUTH)
# default: min=0 (on-demand), max=10
min_acl_connection  0
max_acl_connection  10

# ── Unix domain socket listener (optional) ──────────────────────────────
# clients connect with: valkey-cli -s /tmp/valkey-proxy.sock
# comment out to disable. Plaintext even when tls-enabled is on.
# unix-socket  /tmp/valkey-proxy.sock
# file mode for the socket (octal), e.g. so a sidecar's app container
# running as another user in the same group can connect
# unix-socket-perm  660

# ── TLS for client connections (proxy ↔ client) ──────────────────────────
# disable TLS build with: make valkey-proxy NO_TLS=1
# default: disabled
tls-enabled  no
# tls-cert  /etc/ssl/certs/proxy.crt
# tls-key   /etc/ssl/private/proxy.key
# tls-ca-cert       /etc/ssl/certs/ca.crt   # to verify client certificates
# tls-auth-clients  no                      # no | yes | optional

# ── TLS for backend connections (proxy ↔ Valkey nodes) ───────────────────
# tls-backend          yes
# tls-backend-ca-cert  /etc/ssl/certs/ca.crt
# tls-backend-verify   yes
# tls-backend-cert     /etc/ssl/certs/proxy-client.crt
# tls-backend-key      /etc/ssl/private/proxy-client.key
